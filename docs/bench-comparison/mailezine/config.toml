# mailezine benchmark instance (flat MAILEZINE_* keys, TOML overlay).
# Standalone engine: dev directory/auth from the mounted JSON files, Pebble
# KV (the pure-Go production default), junk filtering disabled so the SMTP
# path measures the engine, not the spam stack.
MAILEZINE_HOSTNAME = "bench.local"
MAILEZINE_LOG_LEVEL = "warn"
MAILEZINE_STORAGE_BACKEND = "pebble"
MAILEZINE_ROCKS_PATH = "/data/kv"
MAILEZINE_HEALTH_ADDR = ":11480"
MAILEZINE_SMTP_ADDR = ":25"
MAILEZINE_IMAP_ADDR = ":143"
MAILEZINE_SUBMISSION_ADDR = ":1587"
MAILEZINE_DIRECTORY_MODE = "dev"
MAILEZINE_DIRECTORY_FILE = "/conf/users.json"
MAILEZINE_AUTH_MODE = "dev"
MAILEZINE_AUTH_DEV_FILE = "/conf/passwords.json"
MAILEZINE_OUTBOUND_ENABLED = "false"
MAILEZINE_JUNK_ENABLED = "false"
