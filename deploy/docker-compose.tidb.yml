# TiDB-backed mailezine dev/e2e stack.
#
# Brings up a single-node TiDB (unistore, MySQL wire protocol) plus the
# mailezine engine with MAILEZINE_STORAGE_BACKEND=tidb. The engine's KV spool
# and mailbox index live in TiDB; attachments blob to a local volume.
#
# This is the ENGINE-ONLY development/e2e surface (no mailez control plane).
# For the unified product stack (control plane + engine + TiDB in one compose
# project) use the mailez repo:
#   mailez/deploy/docker-compose.prod.yml + deploy/mailezctl.[ps1|sh]
#
# All protocol ports are mapped on 127.0.0.1 high ports so this stack can
# coexist with a full mailez compose stack (25/465/587/1143/1587/4190) on the
# same host.
#
# Usage:
#   docker compose -f deploy/docker-compose.tidb.yml up -d --build
#   go run ./cmd/storage-smoke -mode send   -smtp 127.0.0.1:11587 -imap 127.0.0.1:11143 -pop3 127.0.0.1:10110 -subject demo
#   go run ./cmd/storage-smoke -mode check  -imap 127.0.0.1:11143 -pop3 127.0.0.1:10110 -subject demo
#   docker compose -f deploy/docker-compose.tidb.yml down

services:
  tidb:
    image: pingcap/tidb:v8.5.1
    container_name: mailez-tidb
    command: ["--store=unistore", "--path=/tmp/tidb"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - mailez-tidb-data:/tmp/tidb
    healthcheck:
      # TCP probe on the MySQL port; TiDB accepts connections once the SQL
      # layer is up (unistore needs no separate PD/TiKV).
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/4000 && exec 3>&-'"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 8s
    restart: unless-stopped

  mailezine:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mailezine:local-tidb
    container_name: mailez-tidb-engine
    depends_on:
      tidb:
        condition: service_healthy
    environment:
      MAILEZINE_LOG_LEVEL: info
      MAILEZINE_HOSTNAME: localhost
      MAILEZINE_DIRECTORY_MODE: dev
      MAILEZINE_DIRECTORY_FILE: /cfg/dev-directory.json
      MAILEZINE_AUTH_MODE: dev
      MAILEZINE_AUTH_DEV_FILE: /cfg/dev-passwords.json
      MAILEZINE_STORAGE_BACKEND: tidb
      MAILEZINE_STORAGE_DSN: root@tcp(tidb:4000)/test
      # Local FS blob root for attachment bytes (TiDB holds the KV spool and
      # mailbox index only; S3 blob is selectable via MAILEZINE_S3_*). The
      # engine derives the blob dir as <rocks path>.blobs, so the path must
      # sit inside the writable /data volume (uid 82).
      MAILEZINE_ROCKS_PATH: /data/rocks
      MAILEZINE_OUTBOUND_ENABLED: "false"
      MAILEZINE_SMTP_ADDR: :12025
      MAILEZINE_SUBMISSION_ADDR: :11587
      MAILEZINE_IMAP_ADDR: :11143
      MAILEZINE_MANAGESIEVE_ADDR: :11490
      MAILEZINE_POP3_ADDR: :10110
    ports:
      - "127.0.0.1:12025:12025"
      - "127.0.0.1:11587:11587"
      - "127.0.0.1:11143:11143"
      - "127.0.0.1:11490:11490"
      - "127.0.0.1:10110:10110"
      - "127.0.0.1:11480:11480"
    volumes:
      - ../internal/directory/testdata/dev-directory.json:/cfg/dev-directory.json:ro
      - ../internal/auth/testdata/dev-passwords.json:/cfg/dev-passwords.json:ro
      - mailezine-tidb-blobs:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:11480/health", ">/dev/null", "||", "exit", "1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  mailez-tidb-data:
  mailezine-tidb-blobs:
