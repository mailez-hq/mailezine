# Seeding settings, layered on top of the distro defaults: legacy IMAP writes
# the same maildir layout mailez uses (maildir:/mail/%u, Maildir++).
mail_location = maildir:/mail/%u
first_valid_uid = 1
ssl = no

service lmtp {
  inet_listener lmtp {
    port = 2525
  }
}

protocol lmtp {
  postmaster_address = postmaster@example.com
}
