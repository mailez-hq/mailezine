name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Full quality gate on Linux: format, dependency integrity, vet, race-enabled tests and
  # build.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: make verify

  # Windows: the dev platform (Pebble+FS backend). Race needs gcc, so tests
  # run without -race here; the Linux job covers race.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: gofmt -l .
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build ./...

  # Real rspamd container e2e: the /checkv2 client against a live rspamd and
  # the full SMTP→classify→store path. Tagged tests are skipped otherwise.
  rspamd-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Start rspamd
        run: |
          docker run -d --name rspamd -p 11333:11333 rspamd/rspamd:stable
          # First startup compiles hyperscan patterns; poll until /checkv2 answers.
          for i in $(seq 1 120); do
            if curl -sf -m 3 -X POST http://127.0.0.1:11333/checkv2 \
                -H 'From: a@b.c' -H 'Rcpt: x@y.z' -H 'Content-Type: message/rfc822' \
                --data-binary 'Subject: hi' >/dev/null 2>&1; then
              echo "rspamd ready"
              exit 0
            fi
            sleep 5
          done
          docker logs rspamd
          exit 1
      - name: Real rspamd e2e
        run: go test -tags docker ./... -run "TestRealRspamdCheckV2|TestEndToEndRspamd" -count=1 -v
